server {
    listen 80;
    server_name tryon.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
    access_log off;
}
server {
    listen 443 ssl;
    server_name tryon.example.com;
    ssl_certificate /etc/letsencrypt/live/tryon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryon.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 14m;
    location ^~ /assets/ {
        alias /opt/tryon/web/assets/;
        autoindex off;
        expires 1h;
    }
    location = /body-lab { return 410; }
    location ^~ /body-lab/ { return 410; }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
    }
    access_log off;
    error_log /var/log/tryon/error.log;
}
